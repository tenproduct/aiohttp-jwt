sonar.projectKey=tenproduct_aiohttp-jwt
sonar.organization=tengroup
sonar.host.url=https://sonarcloud.io

# Path to sources
sonar.sources=aiohttp_jwt
sonar.tests=tests

# Exclusions
sonar.exclusions=**/__pycache__/**,**/fixtures/**,ci/**,htmlcov/**,coverage.xml

# Coverage report
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/tests/**,**/conftest.py,**/__pycache__/**,**/fixtures/**,ci/**,**/setup.py

# Python specific settings
sonar.python.version=3.10

# Source encoding
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
